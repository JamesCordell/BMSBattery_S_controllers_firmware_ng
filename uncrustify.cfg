# Uncrustify Configuration (Updated for Modern Versions)
indent_with_tabs            = 0        # 0 = spaces, 1 = indent with tabs
indent_columns              = 4        # Number of spaces per indent level
indent_label                = 2        # Indent for goto labels

# Alignment options (Perfect for neat firmware math layouts)
align_keep_tabs             = false
align_with_tabs             = false
align_number_right          = true     # Replaced the old align_number_left
align_func_params           = true     # Aligns function parameters neatly
align_var_def_span          = 2        # Automatically aligns variable declarations vertically

# Spacing options
sp_before_sparen            = force    # space before 'if', 'for', 'while' -> if (x)
sp_after_sparen             = force
sp_inside_paren             = remove   # removes spaces inside ( x ) -> (x)
sp_assign                   = force    # forces space around '=' sign